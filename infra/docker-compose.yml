services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-}
      APPWRITE_PROJECT: ${APPWRITE_PROJECT:-}
      XPENSMAT_DB: /app/data/xpensmat.db
      XPENSMAT_MODEL_DIR: /app/experiments/models
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - xpensmat_data:/app/data
      - xpensmat_reports:/app/reports
      - xpensmat_models:/app/experiments/models
    restart: unless-stopped

volumes:
  xpensmat_data:
  xpensmat_reports:
  xpensmat_models:
