services:
  xpen_backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8080:8080"
    environment:
      XPENSMAT_DB: /app/data/xpensmat.db
      XPENSMAT_DEMO_MODE: ${XPENSMAT_DEMO_MODE:-false}
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-}
      APPWRITE_PROJECT: ${APPWRITE_PROJECT:-}
    volumes:
      - xpen_data:/app/data
      - xpen_reports:/app/reports

volumes:
  xpen_data:
  xpen_reports:
