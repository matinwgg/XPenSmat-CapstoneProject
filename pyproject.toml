[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpensmat"
version = "0.1.0"
description = "Smart Student Expense Predictive System"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abdul-Matin Odoom" }]
dependencies = [
    "joblib>=1.3",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
export = ["python-docx>=1.1", "reportlab>=4.0"]
ml = ["scikit-learn>=1.4", "xgboost>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "scikit-learn>=1.4"]

[project.scripts]
xpensmat = "xpensmat.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["xpensmat*"]
exclude = ["xpensmat.tests*"]

[tool.pytest.ini_options]
testpaths = ["xpensmat/tests"]
pythonpath = ["."]
