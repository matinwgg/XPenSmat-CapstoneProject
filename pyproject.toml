[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xpensmat"
version = "0.1.0"
description = "Smart Student Expense Predictive System"
authors = [{ name="Abdul-Matin Odoom" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "pycryptodome>=3.20",
    "argon2-cffi>=23.1",
]

[tool.setuptools.packages.find]
include = ["xpensmat*"]
