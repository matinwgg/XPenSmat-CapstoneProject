[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpensmat"
version = "0.1.0"
description = "Privacy-minded expense tracking, analytics, and prediction services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
reports = [
    "python-docx>=1.1",
    "reportlab>=4.0",
]
research = [
    "pyarrow>=15.0",
    "xgboost>=2.0",
]
test = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pytest>=8.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pyarrow>=15.0",
    "xgboost>=2.0",
]
dev = [
    "ruff>=0.4",
]

[project.scripts]
xpensmat = "xpensmat.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xpensmat*", "ml*", "core*"]
exclude = ["xpensmat.tests*"]

[tool.pytest.ini_options]
testpaths = ["xpensmat/tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["xpensmat", "ml", "core"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
