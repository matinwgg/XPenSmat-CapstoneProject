name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install flake8 bandit
      - name: Tests
        run: pytest -q
      - name: Critical lint
        run: |
          flake8 xpensmat ml --count --select=E9,F63,F7,F82 \
            --show-source --statistics
      - name: Security scan
        run: bandit -q -ll -r xpensmat
